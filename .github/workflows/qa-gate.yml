# Project: Strug Platform TS

name: QA Gate

on:
  push:
    branches: [main, feature/*, fix/*, v*/*]
  pull_request:
    branches: [main]

jobs:



  frontend-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test -- --run



