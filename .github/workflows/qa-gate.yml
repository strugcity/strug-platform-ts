# QA Gate — generated by strug-standards/scripts/sync-ci.js
# DO NOT EDIT MANUALLY — changes will be overwritten on next sync.
# To opt out: add "ciManagement": "external" in registry.json or add "# MANAGED-EXTERNALLY" as first line
# To keep the audit trigger but not this gate: "ciManagement": "audit-only"
#
# Project: Strug Platform TS

name: QA Gate

on:
  push:
    branches: [main, feature/*, fix/*, v*/*]
  pull_request:
    branches: [main]

# qa-gate executes branch code on every pull_request. Pinned to read so the job
# cannot mutate the repo even if the repository default is later widened.
permissions:
  contents: read

jobs:

  frontend-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
      - name: Test
        run: npm run test -- --run

